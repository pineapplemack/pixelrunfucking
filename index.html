<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Fucking Run 1 (beta)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <style>
    #startBtn {
      position: fixed; left: 50%; bottom: 16%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 15px 40px;
      border-radius: 999px;
      border: 2px solid rgba(255, 226, 150, 0.95);
      background: linear-gradient(180deg, #ffdd7a, #ef9f24);
      color: #3a2300;
      cursor: pointer;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(255, 200, 80, 0.18);
      font: 800 19px/1 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space: nowrap; max-width: 92vw;
      -webkit-tap-highlight-color: transparent;
      animation: startPulse 1.8s ease-in-out infinite;
    }
    #startBtn .sub {
      font: 600 11px/1 system-ui, -apple-system, "PingFang SC", sans-serif;
      opacity: 0.72; letter-spacing: 0.04em;
    }
    #startBtn:active { transform: translateX(-50%) scale(0.96); }
    #startBtn.gone { display: none; }
    @keyframes startPulse {
      0%, 100% { box-shadow: 0 12px 34px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,200,80,0.18); }
      50%      { box-shadow: 0 12px 34px rgba(0,0,0,0.5), 0 0 0 10px rgba(255,200,80,0.05); }
    }
  </style>

  <button id="startBtn">
    <span>▶ 开始游戏</span>
    <span class="sub">点一下就开跑 · 手机建议横屏</span>
  </button>

  <div id="topbar">
    <button id="btnPlay" class="tb" title="开始 / 暂停（P）">▶</button>
    <button id="btnMute" class="tb" title="静音（M）">🔊</button>
    <span class="stat">种子 <b id="seedLabel">—</b><button id="btnSeed" class="mini" title="复制种子">⧉</button></span>
    <span class="stat">最高分 <b id="bestLabel">0</b></span>
    <span class="spacer"></span>
    <span class="brand">PIXEL FUCKING RUN 1 <i>beta</i></span>
    <button id="btnJump" class="jumpbtn" title="跳到任意关卡（测试用）">▾ 跳关</button>
    <button id="btnSet" class="tb" title="设置">⚙</button>
    <button id="btnDev" class="tb" title="开发者控制台（`）">&gt;_</button>
    <button id="btnFull" class="tb" title="全屏">⛶</button>
  </div>

  <div id="rotate">横屏玩更爽 ↻</div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="pads">
      <button class="tpad" data-key="KeyJ">攻击</button>
      <button class="tpad" data-key="Space">跳</button>
      <button class="tpad" data-key="KeyL">冲刺</button>
      <button class="tpad small" data-key="KeyZ">技能</button>
      <button class="tpad small" data-key="Tab">背包</button>
    </div>
  </div>

  <div id="stage">
    <div id="frame">
      <canvas id="game" width="1280" height="704"></canvas>
      <canvas id="ui"></canvas>
    </div>
    <div id="dev" class="hidden">
      <div id="devlog">开发者控制台 · 输入 help 查看指令</div>
      <input id="devinput" type="text" autocomplete="off" spellcheck="false"
             placeholder="例：lvl 5 / god / weapon all / coins 99">
    </div>
  </div>

  <div id="jumpPanel" class="hidden"></div>

  <div id="popover" class="hidden">
    <div class="ttl">设置</div>
    <label class="row"><span>音量</span><input id="vol" type="range" min="0" max="100" value="60"></label>
    <button id="btnReset" class="wide">清除存档记录</button>
    <button id="btnExport" class="wide">导出本关 JSON</button>
    <button id="btnImport" class="wide">导入关卡 JSON</button>
    <input id="fileImport" type="file" accept="application/json,.json" style="display:none">
    <div class="keys">
      ← → 移动　空格 跳（空中再按 = 二段跳）<br>
      Shift 加速　↓ 蹲　↓+J 下砸<br>
      1~9 换武器　J 用武器　L 冲刺　E 交互　T 跳过教程<br>
      P 暂停　R 回存档点
    </div>
  </div>

  <script>
    window.__errors = [];
    window.onerror = function (msg, src, line, col) {
      window.__errors.push(msg + ' @' + (src || '?').split('/').pop() + ':' + line + ':' + col);
      document.title = 'ERR ' + window.__errors.join(' | ');
      var d = document.getElementById('errbox');
      if (!d) {
        d = document.createElement('div');
        d.id = 'errbox';
        d.style.cssText = 'position:fixed;left:0;bottom:0;right:0;background:#3a0d0d;color:#ffb3b3;font:12px monospace;padding:8px;z-index:99;white-space:pre-wrap';
        document.body.appendChild(d);
      }
      d.textContent = window.__errors.join('\n');
    };
  </script>
  <script src="core.js"></script>
  <script src="input.js"></script>
  <script src="audio.js"></script>
  <script src="sprites.js"></script>
  <script src="weapons.js"></script>
  <script src="physics.js"></script>
  <script src="levels.js"></script>
  <script src="gen.js"></script>
  <script src="entities.js"></script>
  <script src="game.js"></script>
  <script src="dev.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('startBtn');
      const touch = document.getElementById('touch');
      const stage = document.getElementById('stage');

      function startGame() {
        window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Enter', bubbles: true }));
        btn.classList.add('gone');
      }
      btn.addEventListener('click', startGame);
      btn.addEventListener('touchstart', function (e) { e.preventDefault(); startGame(); }, { passive: false });
      if (stage) stage.addEventListener('pointerdown', function () {
        if (typeof Game !== 'undefined' && Game.state === 'title') startGame();
      });

      /* 同步：首页时藏起摇杆，进游戏后再出现 */
      setInterval(function () {
        if (typeof Game === 'undefined') return;
        const onTitle = Game.state === 'title';
        btn.classList.toggle('gone', !onTitle);
        if (touch) touch.style.display = onTitle ? 'none' : '';
      }, 250);
    })();
  </script>
</body>
</html>
